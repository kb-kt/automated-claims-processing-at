[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-agent-sdk"
version = "0.1.0"
description = "SDK for the insurance claims review AI agent template."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18"
]

[tool.setuptools.packages.find]
where = ["."]

