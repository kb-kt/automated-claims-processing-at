name: quality-gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r ai_agent_template/developer_kit/starter_kit/requirements.lock
      - name: Verify runtime environment
        run: python scripts/check_environment.py
      - name: Run contract, safety, evaluation, and integration gates
        run: python scripts/run_quality_gates.py
