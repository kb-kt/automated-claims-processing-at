<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Scenario Builder</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d6dee9;
      --text: #17202f;
      --muted: #5e6d82;
      --brand: #155e75;
      --accent: #0f766e;
      --danger: #b42318;
      --warn: #985a00;
      --soft: #edf7f6;
      --warn-soft: #fff7e6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans KR", sans-serif;
      font-size: 13px;
    }
    header {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    main {
      display: grid;
      grid-template-columns: 280px minmax(380px, 1fr) minmax(360px, 0.9fr);
      gap: 14px;
      max-width: 1540px;
      margin: 0 auto;
      padding: 16px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }
    .head {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    h2 { margin: 0; font-size: 14px; }
    .body { padding: 14px; display: grid; gap: 12px; }
    .scenario-list { display: grid; gap: 8px; }
    .scenario-btn {
      min-height: 58px;
      text-align: left;
      display: grid;
      gap: 4px;
      align-content: center;
      background: #fff;
    }
    .scenario-btn.active {
      border-color: var(--brand);
      background: var(--soft);
      color: var(--brand);
    }
    .scenario-btn small {
      color: var(--muted);
      font-weight: 400;
      line-height: 1.25;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }
    input, select, textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    textarea {
      min-height: 128px;
      resize: vertical;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
    .full { grid-column: 1 / -1; }
    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 11px;
      background: #fff;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .message { min-height: 18px; color: var(--muted); }
    .message.error { color: var(--danger); }
    .message.ok { color: var(--accent); }
    .badge {
      border-radius: 999px;
      padding: 4px 9px;
      background: #eef4ff;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }
    .compare {
      border: 1px solid #f0d08a;
      background: var(--warn-soft);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .compare.match { border-color: #b7e2ca; background: #eefaf3; }
    .compare strong { color: var(--warn); }
    .compare.match strong { color: var(--accent); }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #edf1f6;
      padding-bottom: 7px;
    }
    .row span:first-child { color: var(--muted); }
    ul { margin: 0; padding-left: 18px; }
    pre {
      margin: 0;
      padding: 10px;
      border-radius: 6px;
      background: #101828;
      color: #edf5ff;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 360px;
      font-size: 12px;
    }
    @media (max-width: 1180px) {
      main { grid-template-columns: 1fr; padding: 12px; }
      .grid, .tools { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Demo Scenario Builder</h1>
    <span class="badge">Internal Demo Only</span>
  </header>
  <main>
    <section>
      <div class="head"><h2>Scenario Presets</h2></div>
      <div class="body">
        <div class="scenario-list" id="scenarioList"></div>
        <span class="message" id="scenarioMessage"></span>
      </div>
    </section>

    <section>
      <div class="head">
        <h2>Claim Editor</h2>
        <span class="badge" id="selectedBadge">No Scenario</span>
      </div>
      <div class="body">
        <div class="grid">
          <label>Claim ID<input id="claim_id"></label>
          <label>Policy ID<input id="policy_id"></label>
          <label>Product ID<input id="product_id"></label>
          <label>Scenario Type<input id="scenario_type"></label>
          <label>Insured ID<input id="insured_id"></label>
          <label>Age at Service<input id="age_at_service" type="number"></label>
          <label>Sex<select id="sex"><option value="F">F</option><option value="M">M</option><option value="U">U</option></select></label>
          <label>Relation<select id="policyholder_relation"><option value="self">Self</option><option value="spouse">Spouse</option><option value="child">Child</option><option value="parent">Parent</option><option value="other">Other</option></select></label>
          <label>Policy Status<select id="policy_status"><option value="active">Active</option><option value="lapsed">Lapsed</option><option value="terminated">Terminated</option><option value="pending">Pending</option></select></label>
          <label>Claimed Amount<input id="claimed_amount" type="number"></label>
          <label>Care Setting<select id="care_setting"><option value="outpatient">Outpatient</option><option value="inpatient">Inpatient</option><option value="pharmacy">Pharmacy</option></select></label>
          <label>Benefit Category<select id="benefit_category"><option value="covered">Covered</option><option value="noncovered">Noncovered</option><option value="special_noncovered">Special Noncovered</option></select></label>
          <label>Treatment Code<input id="treatment_code"></label>
          <label>Diagnosis Code<input id="diagnosis_code"></label>
          <label>Incident Date<input id="incident_date" type="date"></label>
          <label>Treatment Start<input id="treatment_start_date" type="date"></label>
          <label>Same Diagnosis Claims 90d<input id="same_diagnosis_claims_90d" type="number"></label>
          <label>Same Insured+Provider 30d<input id="same_insured_provider_claims_30d" type="number"></label>
          <label>Provider Claims 30d<input id="same_provider_claims_30d" type="number"></label>
          <label>Duplicate Receipt<select id="suspected_duplicate_receipt"><option value="false">false</option><option value="true">true</option></select></label>
          <label class="full">Submitted Documents<textarea id="documents"></textarea></label>
        </div>

        <div>
          <h2>Mutations</h2>
          <div class="tools">
            <button data-mutation="remove_document">Remove Diagnosis Note</button>
            <button data-mutation="double_amount">Double Amount</button>
            <button data-mutation="high_amount">High Amount</button>
            <button data-mutation="lapsed_policy">Set Lapsed Policy</button>
            <button data-mutation="before_coverage">Before Coverage</button>
            <button data-mutation="duplicate_receipt">Duplicate Receipt ON</button>
            <button data-mutation="repeated_claims">Repeated Claims</button>
            <button data-mutation="reset">Reset Scenario</button>
          </div>
        </div>

        <div class="tools">
          <button id="syncJsonBtn">Sync Form to JSON</button>
          <button id="applyJsonBtn">Apply JSON to Form</button>
          <button id="validateBtn">Validate JSON</button>
          <button class="primary" id="submitBtn">Submit Claim</button>
          <button class="accent" id="runReviewBtn">Run Review</button>
        </div>
        <span class="message" id="actionMessage"></span>
        <textarea id="jsonEditor" class="full"></textarea>
      </div>
    </section>

    <section>
      <div class="head"><h2>Expected vs Actual</h2></div>
      <div class="body">
        <div class="compare" id="compareBox">
          <strong id="compareStatus">Not Run</strong>
          <div class="row"><span>Original Expected</span><strong id="expectedDecision">-</strong></div>
          <div class="row"><span>Actual Decision</span><strong id="actualDecision">-</strong></div>
          <div class="row"><span>Fraud Suspected</span><strong id="fraudSuspected">-</strong></div>
          <div id="scenarioSummary">Select a scenario to begin.</div>
          <ul id="verificationPoints"></ul>
        </div>
        <h2>Review Output</h2>
        <pre id="reviewOutput">{}</pre>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = [
      "claim_id","policy_id","product_id","scenario_type","policy_status","claimed_amount",
      "insured_id","age_at_service","sex","policyholder_relation","care_setting","benefit_category",
      "treatment_code","diagnosis_code","incident_date","treatment_start_date",
      "same_diagnosis_claims_90d","same_insured_provider_claims_30d","same_provider_claims_30d",
      "suspected_duplicate_receipt","documents"
    ];
    let scenarios = [];
    let selectedScenario = null;
    let currentClaim = null;

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw new Error(JSON.stringify(body.detail || body));
      return body;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function uniqueClaim(claim) {
      const next = clone(claim);
      const stamp = String(Date.now()).slice(-6);
      next.claim_id = `${claim.claim_id}-${stamp}`;
      next.policy_id = `${claim.policy_id}-${stamp}`;
      next.claim.receipt_id = `${claim.claim.receipt_id}-${stamp}`;
      next.claim.receipt_hash = `${claim.claim.receipt_hash || claim.claim.receipt_id}-${stamp}`;
      if (next.claim_history.prior_receipt_ids.length) {
        next.claim_history.prior_receipt_ids = [next.claim.receipt_id];
      }
      if (next.claim_history.prior_receipt_hashes.length) {
        next.claim_history.prior_receipt_hashes = [next.claim.receipt_hash];
      }
      return next;
    }

    function renderScenarioList() {
      const list = $("scenarioList");
      list.innerHTML = "";
      scenarios.forEach((scenario) => {
        const button = document.createElement("button");
        button.className = "scenario-btn";
        button.dataset.scenarioId = scenario.id;
        button.innerHTML = `<span>${scenario.name}</span><small>${scenario.summary}</small>`;
        button.addEventListener("click", () => selectScenario(scenario.id));
        list.appendChild(button);
      });
    }

    function selectScenario(id) {
      selectedScenario = scenarios.find((scenario) => scenario.id === id);
      if (!selectedScenario) return;
      currentClaim = uniqueClaim(selectedScenario.claim);
      document.querySelectorAll(".scenario-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.scenarioId === id);
      });
      $("selectedBadge").textContent = selectedScenario.name;
      fillForm(currentClaim);
      syncJson();
      renderExpected();
      clearActual();
    }

    function fillForm(claim) {
      $("claim_id").value = claim.claim_id;
      $("policy_id").value = claim.policy_id;
      $("product_id").value = claim.product_id;
      $("scenario_type").value = claim.scenario_type;
      $("insured_id").value = claim.insured_profile.insured_id;
      $("age_at_service").value = claim.insured_profile.age_at_service;
      $("sex").value = claim.insured_profile.sex;
      $("policyholder_relation").value = claim.insured_profile.policyholder_relation;
      $("policy_status").value = claim.policy.status;
      $("claimed_amount").value = claim.claim.claimed_amount;
      $("care_setting").value = claim.claim.care_setting;
      $("benefit_category").value = claim.claim.benefit_category;
      $("treatment_code").value = claim.claim.treatment_code;
      $("diagnosis_code").value = claim.claim.diagnosis_code;
      $("incident_date").value = claim.claim.incident_date;
      $("treatment_start_date").value = claim.claim.treatment_start_date;
      $("same_diagnosis_claims_90d").value = claim.claim_history.same_diagnosis_claims_90d;
      $("same_insured_provider_claims_30d").value = claim.claim_history.same_insured_provider_claims_30d;
      $("same_provider_claims_30d").value = claim.claim_history.same_provider_claims_30d;
      $("suspected_duplicate_receipt").value = claim.signals.suspected_duplicate_receipt ? "true" : "false";
      $("documents").value = claim.documents.join("\n");
    }

    function claimFromForm() {
      const base = currentClaim || uniqueClaim(scenarios[0].claim);
      const receiptId = base.claim.receipt_id;
      const receiptHash = base.claim.receipt_hash;
      const duplicate = $("suspected_duplicate_receipt").value === "true";
      const age = Number($("age_at_service").value);
      return {
        claim_id: $("claim_id").value.trim(),
        policy_id: $("policy_id").value.trim(),
        product_id: $("product_id").value.trim(),
        scenario_type: $("scenario_type").value.trim(),
        insured_profile: {
          insured_id: $("insured_id").value.trim(),
          age_at_service: age,
          age_band: ageBand(age),
          sex: $("sex").value,
          policyholder_relation: $("policyholder_relation").value
        },
        claimant: {
          synthetic_person_id: $("insured_id").value.trim(),
          age: age,
          gender: $("sex").value === "U" ? "F" : $("sex").value
        },
        policy: {
          status: $("policy_status").value,
          coverage_start_date: base.policy.coverage_start_date,
          coverage_end_date: base.policy.coverage_end_date
        },
        claim: {
          care_setting: $("care_setting").value,
          benefit_category: $("benefit_category").value,
          treatment_code: $("treatment_code").value.trim(),
          diagnosis_code: $("diagnosis_code").value.trim(),
          incident_date: $("incident_date").value,
          treatment_start_date: $("treatment_start_date").value,
          treatment_end_date: base.claim.treatment_end_date,
          claim_date: base.claim.claim_date,
          claimed_amount: Number($("claimed_amount").value),
          receipt_id: receiptId,
          receipt_hash: receiptHash,
          provider_id: base.claim.provider_id,
          provider_type: base.claim.provider_type
        },
        documents: $("documents").value.split(/\r?\n/).map((value) => value.trim()).filter(Boolean),
        claim_history: {
          same_diagnosis_claims_90d: Number($("same_diagnosis_claims_90d").value),
          same_insured_provider_claims_30d: Number($("same_insured_provider_claims_30d").value),
          same_provider_claims_30d: Number($("same_provider_claims_30d").value),
          manual_therapy_count_180d: base.claim_history.manual_therapy_count_180d,
          prior_receipt_hashes: duplicate ? [receiptHash] : [],
          prior_receipt_ids: duplicate ? [receiptId] : []
        },
        signals: {
          ...clone(base.signals),
          suspected_duplicate_receipt: duplicate
        }
      };
    }

    function ageBand(age) {
      if (age >= 80) return "80plus";
      if (age < 10) return "0-9";
      return `${Math.floor(age / 10)}0s`;
    }

    function syncJson() {
      currentClaim = claimFromForm();
      $("jsonEditor").value = JSON.stringify(currentClaim, null, 2);
    }

    function applyJson() {
      currentClaim = JSON.parse($("jsonEditor").value);
      fillForm(currentClaim);
      syncJson();
    }

    function renderExpected() {
      if (!selectedScenario) return;
      $("expectedDecision").textContent = selectedScenario.expected_decision;
      $("scenarioSummary").textContent = selectedScenario.summary;
      const list = $("verificationPoints");
      list.innerHTML = "";
      selectedScenario.verification_points.forEach((point) => {
        const li = document.createElement("li");
        li.textContent = point;
        list.appendChild(li);
      });
    }

    function clearActual() {
      $("compareBox").className = "compare";
      $("compareStatus").textContent = "Not Run";
      $("actualDecision").textContent = "-";
      $("fraudSuspected").textContent = "-";
      $("reviewOutput").textContent = "{}";
    }

    function renderReview(result) {
      const output = result.output || result;
      const matches = selectedScenario && output.recommended_decision === selectedScenario.expected_decision;
      $("compareBox").className = matches ? "compare match" : "compare";
      $("compareStatus").textContent = matches ? "Expected matched" : "Review completed";
      $("actualDecision").textContent = output.recommended_decision;
      $("fraudSuspected").textContent = String(output.fraud_suspected);
      $("reviewOutput").textContent = JSON.stringify(output, null, 2);
    }

    function mutate(type) {
      let claim = claimFromForm();
      if (type === "reset") {
        selectScenario(selectedScenario.id);
        return;
      }
      if (type === "remove_document") {
        claim.documents = claim.documents.filter((doc) => doc !== "diagnosis_note");
      }
      if (type === "double_amount") {
        claim.claim.claimed_amount = claim.claim.claimed_amount * 2;
      }
      if (type === "high_amount") {
        claim.claim.claimed_amount = 1200000;
      }
      if (type === "lapsed_policy") {
        claim.policy.status = "lapsed";
      }
      if (type === "before_coverage") {
        claim.claim.incident_date = "2025-12-20";
        claim.claim.treatment_start_date = "2025-12-21";
        claim.claim.treatment_end_date = "2025-12-21";
      }
      if (type === "duplicate_receipt") {
        claim.signals.suspected_duplicate_receipt = true;
        claim.claim_history.prior_receipt_hashes = [claim.claim.receipt_hash];
        claim.claim_history.prior_receipt_ids = [claim.claim.receipt_id];
      }
      if (type === "repeated_claims") {
        claim.claim_history.same_diagnosis_claims_90d = 5;
      }
      currentClaim = claim;
      fillForm(currentClaim);
      syncJson();
      clearActual();
    }

    function validateJson() {
      try {
        const claim = JSON.parse($("jsonEditor").value);
        const forbidden = ["expected_decision", "expected_payable_amount", "reason_codes", "calculation"];
        const leaked = forbidden.filter((field) => Object.prototype.hasOwnProperty.call(claim, field));
        if (leaked.length) throw new Error(`Remove demo/evaluation fields from payload: ${leaked.join(", ")}`);
        $("actionMessage").textContent = "JSON is parseable and contains no top-level expected fields.";
        $("actionMessage").className = "message ok";
      } catch (error) {
        $("actionMessage").textContent = error.message;
        $("actionMessage").className = "message error";
      }
    }

    async function submitClaim() {
      try {
        applyJson();
        const response = await requestJson("/claims", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(currentClaim)
        });
        $("actionMessage").textContent = `${response.claim_id} submitted.`;
        $("actionMessage").className = "message ok";
      } catch (error) {
        $("actionMessage").textContent = error.message;
        $("actionMessage").className = "message error";
      }
    }

    async function runReview() {
      try {
        applyJson();
        const result = await requestJson("/reviews", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ claim: currentClaim })
        });
        renderReview(result);
        $("actionMessage").textContent = "Review completed.";
        $("actionMessage").className = "message ok";
      } catch (error) {
        $("actionMessage").textContent = error.message;
        $("actionMessage").className = "message error";
      }
    }

    async function init() {
      try {
        const data = await requestJson("/demo/scenarios");
        scenarios = data.scenarios;
        renderScenarioList();
        selectScenario(scenarios[0].id);
      } catch (error) {
        $("scenarioMessage").textContent = error.message;
        $("scenarioMessage").className = "message error";
      }
    }

    fields.forEach((id) => $(id).addEventListener("input", syncJson));
    document.querySelectorAll("[data-mutation]").forEach((button) => {
      button.addEventListener("click", () => mutate(button.dataset.mutation));
    });
    $("syncJsonBtn").addEventListener("click", syncJson);
    $("applyJsonBtn").addEventListener("click", applyJson);
    $("validateBtn").addEventListener("click", validateJson);
    $("submitBtn").addEventListener("click", submitClaim);
    $("runReviewBtn").addEventListener("click", runReview);
    init();
  </script>
</body>
</html>
